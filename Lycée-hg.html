<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lycée - Histoire-géo</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            color: #333;
            overflow-x: hidden;

            opacity: 0;
            transform: translateY(20px) scale(0.98);
            animation: pageFade 0.8s ease forwards;
        }


        /* =========================
           ANIMATION DE LA PAGE
        ========================= */

        @keyframes pageFade {

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* =========================
           HEADER PREMIUM
        ========================= */

        header {

            background: #0b3d91;

            text-align: center;

            padding: 35px 20px 40px;

            color: white;

            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);

            position: relative;

            overflow: hidden;
        }


        /* Petite lumière décorative */

        header::before {

            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            background: rgba(255, 255, 255, 0.08);

            border-radius: 50%;

            top: -100px;
            left: -70px;
        }


        header::after {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            background: rgba(255, 215, 0, 0.08);

            border-radius: 50%;

            bottom: -100px;
            right: -50px;
        }


        header h1 {

            background: white;

            color: black;

            display: inline-block;

            padding: 14px 35px;

            border-radius: 16px;

            margin: 0;

            font-size: 42px;

            font-weight: 600;

            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);

            position: relative;

            z-index: 2;

            transition: 0.3s ease;
        }


        header h1:hover {

            transform: scale(1.04);
        }


        header p {

            margin: 20px 0 0;

            font-size: 19px;

            font-weight: 400;

            position: relative;

            z-index: 2;
        }


        /* Petit trait doré */

        header p::after {

            content: "";

            display: block;

            width: 55px;
            height: 4px;

            background: gold;

            border-radius: 10px;

            margin: 14px auto 0;
        }


        /* =========================
           TITRE
        ========================= */

        h2 {

            text-align: center;

            color: #222;

            margin-top: 50px;

            font-size: 28px;

            font-weight: 600;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            display: flex;

            justify-content: center;

            align-items: stretch;

            gap: 25px;

            margin-top: 35px;

            padding: 20px;

            flex-wrap: wrap;
        }


        /* =========================
           CARTES
        ========================= */

        .classe {

            background: white;

            padding: 35px 30px;

            border-radius: 22px;

            width: 240px;

            min-height: 125px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-size: 22px;

            font-weight: 600;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease,
                color 0.3s ease;

            text-decoration: none;

            color: #111;

            position: relative;

            overflow: hidden;
        }


        /* Reflet sur la carte */

        .classe::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.35),
                transparent
            );

            transition: 0.5s;
        }


        .classe:hover::before {

            left: 100%;
        }


        .classe:hover {

            transform: translateY(-8px) scale(1.03);

            background: #0b3d91;

            color: white;

            box-shadow: 0 15px 30px rgba(11, 61, 145, 0.25);
        }


        /* =========================
           PETIT TEXTE SOUS LES CARTES
        ========================= */

        .subtitle {

            text-align: center;

            margin-top: 5px;

            color: #777;

            font-size: 14px;
        }


        /* =========================
           PROTECTION FIREBASE
        ========================= */

        body.auth-pending > * {

            visibility: hidden;
        }


        body.auth-pending #access-blocked {

            visibility: visible;
        }


        /* =========================
           UTILISATEUR NON CONNECTÉ
        ========================= */

        body.auth-logged-out > *:not(#access-blocked) {

            display: none !important;
        }


        body.auth-logged-out #access-blocked {

            display: flex !important;
        }


        /* =========================
           UTILISATEUR CONNECTÉ
        ========================= */

        body.auth-logged-in #access-blocked {

            display: none !important;
        }


        /* =========================
           ÉCRAN DE BLOCAGE
        ========================= */

#access-blocked {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #f5f5f5;

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 999999;

            padding: 20px;
        }


        .blocked-box {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 45px 30px;

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.12);

            animation: blockedAppear 0.5s ease;
        }


        @keyframes blockedAppear {

            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        .blocked-icon {

            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #eef3ff;

            border-radius: 50%;

            font-size: 38px;
        }


        .blocked-box h2 {

            margin: 0 0 12px;

            color: #0b3d91;

            font-size: 26px;
        }


        .blocked-box p {

            margin: 0 auto 28px;

            max-width: 330px;

            color: #666;

            line-height: 1.7;

            font-size: 15px;
        }

        /* =========================
           BOUTON INSCRIPTION
        ========================= */

        #signup-btn {

            border: none;

            background: #0b3d91;

            color: white;

            padding: 14px 28px;

            border-radius: 30px;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }


        #signup-btn:hover {

            background: #082f70;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(11, 61, 145, 0.25);
        }


        #signup-btn:active {

            transform: scale(0.96);
        }



        /* =========================
           RESPONSIVE MOBILE
        ========================= */

        @media (max-width: 768px) {

            header {

                padding: 35px 15px 38px;

                border-bottom-left-radius: 30px;

                border-bottom-right-radius: 30px;
            }


            header h1 {

                font-size: 36px;

                padding: 13px 30px;

                border-radius: 15px;
            }


            header p {

                font-size: 18px;

                margin-top: 18px;
            }


            h2 {

                font-size: 26px;

                margin-top: 38px;

                padding: 0 15px;
            }


            .container {

                flex-direction: column;

                align-items: center;

                gap: 25px;

                margin-top: 30px;

                padding: 15px 20px 40px;
            }


            .classe {

                width: 90%;

                max-width: 480px;

                min-height: 125px;

                font-size: 21px;

                border-radius: 22px;
            }

        }


        /* =========================
           TRÈS PETITS ÉCRANS
        ========================= */

        @media (max-width: 400px) {

            header h1 {

                font-size: 32px;

                padding: 12px 25px;
            }


            header p {

                font-size: 16px;
            }


            h2 {

                font-size: 23px;
            }


            .classe {

                width: 92%;

                min-height: 115px;

                font-size: 20px;
            }

        }

    </style>

</head>


<body class="auth-pending">


    <!-- =========================
         ÉCRAN DE BLOCAGE
    ========================= -->

    <div id="access-blocked">

        <div class="blocked-box">

            <div class="blocked-icon">
                🔒
            </div>

            <h2>
                Inscris-toi d'abord
            </h2>

            <p>
                Connecte-toi ou crée ton compte pour accéder
                aux cours de Djeli.
            </p>

            <button id="signup-btn">
                Créer mon compte
            </button>

        </div>

    </div>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>
            Lycée
        </h1>

        <p>
            Choisis ton niveau
        </p>

    </header>


    <!-- =========================
         TITRE
    ========================= -->

    <h2>
        📚 Sélectionne ta classe
    </h2>


    <p class="subtitle">
        Choisis ton niveau pour commencer tes révisions
    </p>


    <!-- =========================
         CLASSES
    ========================= -->

    <section class="container">

        <a
            href="2nde_hg.html"
            class="classe"
        >
            2nde
        </a>


        <a
            href="1ere_hg.html"
            class="classe"
        >
            1ère
        </a>


        <a
            href="Tle_hg.html"
            class="classe"
        >
            Tle
        </a>

    </section>

<!-- =========================
     FIREBASE AUTHENTIFICATION
========================= -->

<script type="module">

import { auth } from "./js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const signupButton =
    document.getElementById("signup-btn");


onAuthStateChanged(auth, (user) => {

    console.log(
        user
        ? "🟢 Utilisateur connecté"
        : "🔴 Utilisateur déconnecté"
    );


    /* Firebase a terminé la vérification */

    document.body.classList.remove("auth-pending");


    if (user) {

        /* =========================
           🔓 CONNECTÉ
        ========================= */

        document.body.classList.add(
            "auth-logged-in"
        );

        document.body.classList.remove(
            "auth-logged-out"
        );

        console.log("🔓 Accès aux cours autorisé.");

    } else {

        /* =========================
           🔒 NON CONNECTÉ
        ========================= */

        document.body.classList.add(
            "auth-logged-out"
        );

        document.body.classList.remove(
            "auth-logged-in"
        );

        console.log("🔒 Accès aux cours bloqué.");

    }

});


/* =========================
   BOUTON INSCRIPTION
========================= */

signupButton.addEventListener("click", () => {

    window.location.href = "signup.html";

});

</script>

</body>

</html>

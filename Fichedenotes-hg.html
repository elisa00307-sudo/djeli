<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Djeli | Fiches de notes</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f5f5f5;
            margin: 0;
            overflow-x: hidden;

            opacity: 0;
            transform: translateY(20px) scale(0.98);

            animation: pageFade 1s ease forwards;
        }

        @keyframes pageFade {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: #0b3d91;
            text-align: center;
            padding: 35px 20px 40px;
            color: white;

            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);

            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            background: rgba(255, 255, 255, 0.08);

            border-radius: 50%;

            top: -100px;
            left: -70px;
        }

        header::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            background: rgba(255, 215, 0, 0.08);

            border-radius: 50%;

            bottom: -100px;
            right: -50px;
        }

        header h1 {
            background: white;
            color: black;

            display: inline-block;

            padding: 14px 35px;

            border-radius: 16px;

            margin: 0;

            font-size: 42px;
            font-weight: 600;

            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);

            position: relative;
            z-index: 2;

            transition: 0.3s ease;
        }

        header h1:hover {
            transform: scale(1.04);
        }

        header p {
            margin: 20px 0 0;

            font-size: 19px;
            font-weight: 400;

            position: relative;
            z-index: 2;
        }

        header p::after {
            content: "";

            display: block;

            width: 55px;
            height: 4px;

            background: gold;

            border-radius: 10px;

            margin: 14px auto 0;
        }


        /* =========================
           CONTENEUR DES CARTES
        ========================= */

        .cards-container {
            display: grid;

            grid-template-columns: repeat(
                auto-fit,
                minmax(300px, 350px)
            );

            gap: 30px;

            justify-content: center;

            padding: 40px 20px 60px;
        }


        /* =========================
           CARTE
        ========================= */

        .card {
            width: 100%;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.18);
        }


        /* =========================
           IMAGE
        ========================= */

        .card img {
            width: 100%;
            height: auto;

            display: block;

            background: #eeeeee;
        }


        /* =========================
           CAPTION
        ========================= */

        .caption {
            text-align: center;

            font-weight: 600;

            background: #f8f8f8;

            padding: 15px;

            font-size: 18px;

            min-height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            line-height: 1.4;
        }

        .caption em {
            display: block;

            font-size: 10px;

            font-weight: 400;

            margin-top: 4px;
        }


        /* =========================
           BOUTON TELECHARGEMENT
        ========================= */

        .download {
            display: block;

            width: 100%;

            text-align: center;

            background: gold;

            color: black;

            font-family: "Poppins", sans-serif;

            font-weight: 600;

            padding: 15px;

            border: none;

            cursor: pointer;

            font-size: 16px;

            margin-top: auto;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.2s ease;
        }

        .download:hover {
            background: #0b3d91;
            color: white;
        }

        .download:active {
            transform: scale(0.97);
        }

        .download:disabled {
            opacity: 0.7;
            cursor: wait;
        }


        /* =========================
           PROTECTION FIREBASE
        ========================= */

        body.auth-pending > * {
            visibility: hidden;
        }

        body.auth-pending #access-blocked {
            visibility: visible;
        }


        /* =========================
           UTILISATEUR NON CONNECTÉ
        ========================= */

        body.auth-logged-out > *:not(#access-blocked) {
            display: none !important;
        }

        body.auth-logged-out #access-blocked {
            display: flex !important;
        }


        /* =========================
           UTILISATEUR CONNECTÉ
        ========================= */

        body.auth-logged-in #access-blocked {
            display: none !important;
        }


        /* =========================
           ÉCRAN DE BLOCAGE
        ========================= */

        #access-blocked {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #f5f5f5;

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 999999;

            padding: 20px;
        }

        .blocked-box {
            width: 100%;

            max-width: 430px;

            background: white;

            padding: 45px 30px;

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.12);

            animation: blockedAppear 0.5s ease;
        }

        @keyframes blockedAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .blocked-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #eef3ff;

            border-radius: 50%;

            font-size: 38px;
        }

        .blocked-box h2 {
            margin: 0 0 12px;

            color: #0b3d91;

            font-size: 26px;
        }

        .blocked-box p {
            margin: 0 auto 28px;

            max-width: 330px;

            color: #666;

            line-height: 1.7;

            font-size: 15px;
        }


        /* =========================
           BOUTON INSCRIPTION
        ========================= */

        #signup-btn {
            border: none;

            background: #0b3d91;

            color: white;

            padding: 14px 28px;

            border-radius: 30px;

            font-family: "Poppins", sans-serif;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        #signup-btn:hover {
            background: #082f70;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(11, 61, 145, 0.25);
        }

        #signup-btn:active {
            transform: scale(0.96);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            header {
                padding: 25px 15px 30px;
            }

            header h1 {
                font-size: 23px;

                padding: 12px 20px;
            }

            header p {
                font-size: 16px;
            }

            .cards-container {
                grid-template-columns: 1fr;

                padding: 25px 15px 40px;

                gap: 20px;
            }

            .card {
                width: 100%;
                max-width: 500px;

                margin: 0 auto;
            }

            .caption {
                font-size: 16px;
            }

            .download {
                font-size: 15px;

                padding: 14px;
            }
        }

        @media (max-width: 400px) {

            header h1 {
                font-size: 20px;
            }

            .blocked-box {
                padding: 35px 22px;
            }

            .blocked-box h2 {
                font-size: 23px;
            }
        }

    </style>

</head>


<body class="auth-pending">


    <!-- =========================
         ÉCRAN DE BLOCAGE
    ========================= -->

    <div id="access-blocked">

        <div class="blocked-box">

            <div class="blocked-icon">
                🔒
            </div>

            <h2>
                Inscris-toi d'abord
            </h2>

            <p>
                Connecte-toi ou crée ton compte pour accéder
                aux fiches de notes de Djeli.
            </p>

            <button id="signup-btn">
                Créer mon compte
            </button>

        </div>

    </div>


    <!-- =========================
         CONTENU DE LA PAGE
    ========================= -->

    <header>

        <h1>
            Des fiches de notes à télécharger !
        </h1>

        <p>
            Révise avec style sur Djeli 📚✨
        </p>

    </header>


    <main>

        <div
            class="cards-container"
            id="cards-container"
        ></div>

    </main>


    <!-- =========================
         FIREBASE AUTHENTIFICATION
    ========================= -->

        /* =========================

            },

            {

            },

            {
                image: `${CDN}DXYN1797.webp`,

            },

            {
                image: `${CDN}GHDZ5465.webp`,
                title: "Mythologie grecque",

            },

            {
                image: `${CDN}GTMC1088.webp`,
                title: "Spécial 1er cycle Sainte Marie",

            },

            {
                image: `${CDN}HKEH0051.webp`,
                title: "Pixel food",
                fileName: "pixel-food.webp"
            },

            {
                image: `${CDN}HQQF9818.webp`,
                title: "Yare yare...",

            },

            {
                image: `${CDN}HVDE0686.webp`,

            },

            {

                title: "Nuit étoilée de Van Gogh",

            },

            {

                title: "Mangas",

            },

            {

            },

            {

            },

            {
                image: `${CDN}NDHL0448.webp`,
                title: "Harry Potter",

            },

            {
                image: `${CDN}NPPG5442.webp`,

            },

            },

            },

                    <em>Surcoté mais bon 😒</em>`,

            },

                title: "Spécial 1er cycle Sainte Marie",
                fileName: "kuromi.webp"
            },

            {
                image: `${CDN}USLW6633.webp`,
                title: "Stranger Things",
                fileName: "stranger-things.webp"
            },

            {
                image: `${CDN}VUKD5179.webp`,
                title: "The Legend of Zelda",
                fileName: "the-legend-of-zelda.webp"
            },

            {
                image: `${CDN}XCMT3253.webp`,
                title: "Spécial 1er cycle Sainte Marie",
                fileName: "cinnamoroll-special.webp"
            },

            {
                image: `${CDN}XHDY6611.webp`,
                title: "Hunter x Hunter",
                fileName: "hunter-x-hunter.webp"
            }

        ];


        /* =========================
           CRÉATION DES CARTES
        ========================= */

        const cardsContainer =
            document.getElementById("cards-container");


        fiches.forEach((fiche) => {

            const card =
                document.createElement("div");

            card.className = "card";


            /*
             * Nettoyage du titre pour le texte alternatif
             */

            const cleanTitle =
                fiche.title.replace(/<[^>]*>/g, "");


            card.innerHTML = `

                <img
                    src="${fiche.image}"
                    alt="Fiche ${cleanTitle}"
                    loading="lazy"
                >

                <div class="caption">
                    ${fiche.title}
                </div>

                <button
                    class="download"
                    type="button"
                >
                    📥 Télécharger la fiche
                </button>

            `;


            const button =
                card.querySelector(".download");


            button.addEventListener("click", () => {

                downloadFile(
                    fiche.image,
                    fiche.fileName,
                    button
                );

            });


            cardsContainer.appendChild(card);

        });


        /* =========================
           TÉLÉCHARGEMENT
        ========================= */

        async function downloadFile(
            url,
            fileName,
            button
        ) {

            const originalText =
                button.innerHTML;


            try {

                button.disabled = true;

                button.innerHTML =
                    "⏳ Téléchargement...";


                const response =
                    await fetch(url, {
                        mode: "cors"
                    });


                if (!response.ok) {

                    throw new Error(
                        "Impossible de récupérer l'image."
                    );

                }


                const blob =
                    await response.blob();


                const blobUrl =
                    URL.createObjectURL(blob);


                const link =
                    document.createElement("a");


                link.href = blobUrl;

                link.download = fileName;

                link.style.display = "none";


                document.body.appendChild(link);

                link.click();

                link.remove();


                setTimeout(() => {

                    URL.revokeObjectURL(blobUrl);

                }, 1000);


                button.innerHTML =
                    "✅ Fiche téléchargée !";


                setTimeout(() => {

                    button.innerHTML =
                        originalText;

                    button.disabled = false;

                }, 1800);


            } catch (error) {

                console.error(
                    "Erreur téléchargement :",
                    error
                );


                button.innerHTML =
                    "⚠️ Ouvrir la fiche";


                button.disabled = false;


                /*
                 * Si le téléchargement automatique
                 * est bloqué, on ouvre directement
                 * l'image dans un nouvel onglet.
                 */

                window.open(
                    url,
                    "_blank"
                );


                setTimeout(() => {

                    button.innerHTML =
                        originalText;

                }, 1800);

            }

        }


        /* =========================
           FIREBASE
        ========================= */

        const signupButton =
            document.getElementById(
                "signup-btn"
            );


        onAuthStateChanged(
            auth,
            (user) => {

                console.log(
                    user
                        ? "🟢 Utilisateur connecté"
                        : "🔴 Utilisateur déconnecté"
                );


                /*
                 * Firebase a terminé
                 * la vérification.
                 */

                document.body.classList.remove(
                    "auth-pending"
                );


                if (user) {

                    /* =========================
                       UTILISATEUR CONNECTÉ
                    ========================= */

                    document.body.classList.add(
                        "auth-logged-in"
                    );

                    document.body.classList.remove(
                        "auth-logged-out"
                    );

                    console.log(
                        "🔓 Accès aux fiches autorisé."
                    );


                } else {

                    /* =========================
                       UTILISATEUR NON CONNECTÉ
                    ========================= */

                    document.body.classList.add(
                        "auth-logged-out"
                    );

                    document.body.classList.remove(
                        "auth-logged-in"
                    );

                    console.log(
                        "🔒 Accès aux fiches bloqué."
                    );

                }

            }
        );


        /* =========================
           BOUTON INSCRIPTION
        ========================= */

        signupButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    "signup.html";

            }
        );

    </script>

</html>

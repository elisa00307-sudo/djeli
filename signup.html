<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inscription</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
    rel="stylesheet"
>

<style>

body{
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;

    background: linear-gradient(135deg,#0b3d91,#4169e1);

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    opacity: 0;
    transform: translateY(20px);
    animation: fadePage 1s ease forwards;
}

@keyframes fadePage{

    to{
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   CARTE
========================= */

.student-card{

    background: white;

    width: 90%;
    max-width: 420px;

    padding: 40px 30px;

    border-radius: 30px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);

    text-align: center;

    animation: cardFloat 3s ease-in-out infinite;
}

@keyframes cardFloat{

    0%{
        transform: translateY(0px);
    }

    50%{
        transform: translateY(-5px);
    }

    100%{
        transform: translateY(0px);
    }

}


.student-card h2{

    color: #0b3d91;

    margin-bottom: 30px;

}


/* =========================
   INPUTS
========================= */

.student-card input{

    width: 90%;

    padding: 14px;

    margin-bottom: 18px;

    border-radius: 15px;

    border: 2px solid #ddd;

    font-size: 15px;

    font-family: 'Poppins', sans-serif;

    transition: 0.3s;

    outline: none;
}

.student-card input:focus{

    border-color: royalblue;

    box-shadow: 0 0 10px rgba(65,105,225,0.3);

}


/* =========================
   BOUTON
========================= */

.save-btn{

    background: gold;

    color: black;

    border: none;

    padding: 14px 35px;

    border-radius: 40px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: all 0.3s ease;

    font-family: 'Poppins', sans-serif;
}

.save-btn:hover{

    background: royalblue;

    color: white;

    transform: scale(1.05);

    box-shadow: 0 8px 20px rgba(65,105,225,0.4);

}

.save-btn:disabled{

    opacity: 0.7;

    cursor: not-allowed;

    transform: none;

}


/* =========================
   TEXTE BAS
========================= */

.bottom-text{

    margin-top: 25px;

    font-size: 14px;
}

.bottom-text a{

    color: #0b3d91;

    text-decoration: none;

    font-weight: bold;
}

.bottom-text a:hover{

    color: royalblue;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

    .student-card{

        padding: 30px 20px;

    }

    .student-card h2{

        font-size: 24px;

    }

}

</style>

</head>


<body>


<div class="student-card">

    <h2>Créer un compte ✨</h2>


    <input
        type="text"
        id="fullname"
        placeholder="Nom et prénom"
        autocomplete="name"
    >


    <input
        type="text"
        id="school"
        placeholder="École"
        autocomplete="organization"
    >


    <input
        type="number"
        id="age"
        placeholder="Âge"
        min="10"
        max="100"
        inputmode="numeric"
    >


    <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
    >


    <input
        type="password"
        id="password"
        placeholder="Mot de passe"
        autocomplete="new-password"
    >


    <button
        class="save-btn"
        onclick="signup()"
        id="signupButton"
        type="button"
    >

        S'inscrire

    </button>


    <div class="bottom-text">

        Déjà un compte ?

        <a href="login.html">
            Connexion
        </a>

    </div>

</div>


<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   🌍 DÉTECTION AUTOMATIQUE DU PAYS
   Plusieurs services de secours
========================================= */

async function detectCountry() {

    const services = [

        async () => {

            const response = await fetch(
                "https://ipwho.is/"
            );

            if (!response.ok) {
                throw new Error("ipwho.is indisponible");
            }

            const data = await response.json();

            if (data.success === false) {
                throw new Error("Détection échouée");
            }

            return data.country;

        },


        async () => {

            const response = await fetch(
                "https://ipapi.co/json/"
            );

            if (!response.ok) {
                throw new Error("ipapi.co indisponible");
            }

            const data = await response.json();

            return data.country_name;

        }

    ];


    for (const service of services) {

        try {

            const country = await service();

            if (
                country &&
                country.trim() !== ""
            ) {

                console.log(
                    "🌍 Pays détecté :",
                    country
                );

                return country;

            }

        } catch (error) {

            console.warn(
                "⚠️ Service de localisation indisponible :",
                error.message
            );

        }

    }


    console.warn(
        "⚠️ Aucun service n'a réussi à détecter le pays."
    );

    return "Inconnu";
}


/* =========================================
   📝 INSCRIPTION
========================================= */

window.signup = async function () {


    /* =========================================
       🔎 RÉCUPÉRER LES CHAMPS
    ========================================= */

    const fullnameInput =
        document.getElementById("fullname");

    const schoolInput =
        document.getElementById("school");

    const ageInput =
        document.getElementById("age");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const signupButton =
        document.getElementById("signupButton");


    /* =========================================
       🧹 NETTOYER LES VALEURS
    ========================================= */

    const fullname =
        fullnameInput.value.trim();

    const school =
        schoolInput.value.trim();

    const age =
        ageInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    /* =========================================
       🔎 VÉRIFICATION PRÉCISE DES CHAMPS
    ========================================= */

    if (!fullname) {

        alert("Remplis ton nom et prénom 😭");

        fullnameInput.focus();

        return;
    }


    if (!school) {

        alert("Remplis ton école 😭");

        schoolInput.focus();

        return;
    }


    if (!age) {

        alert("Indique ton âge 😭");

        ageInput.focus();

        return;
    }


    if (!email) {

        alert("Remplis ton adresse email 😭");

        emailInput.focus();

        return;
    }


    if (!password) {

        alert("Choisis un mot de passe 😭");

        passwordInput.focus();

        return;
    }


    /* =========================================
       🎂 VÉRIFICATION DE L'ÂGE
    ========================================= */

    const numericAge = Number(age);


    if (
        !Number.isFinite(numericAge) ||
        numericAge < 10 ||
        numericAge > 100
    ) {

        alert(
            "Entre un âge valide entre 10 et 100 ans 📚"
        );

        ageInput.focus();

        return;
    }


    /* =========================================
       📧 VÉRIFICATION EMAIL
    ========================================= */

    if (!emailInput.checkValidity()) {

        alert(
            "Entre une adresse email valide 📧"
        );

        emailInput.focus();

        return;
    }


    /* =========================================
       🔐 VÉRIFICATION MOT DE PASSE
    ========================================= */

    if (password.length < 6) {

        alert(
            "Ton mot de passe doit contenir au moins 6 caractères 🔐"
        );

        passwordInput.focus();

        return;
    }


    try {


        /* =========================================
           ⏳ DÉSACTIVER LE BOUTON
        ========================================= */

        signupButton.disabled = true;

        signupButton.textContent =
            "Création du compte...";


        /* =========================================
           🌍 DÉTECTER LE PAYS
        ========================================= */

        const country =
            await detectCountry();


        console.log(
            "🌍 Pays enregistré :",
            country
        );


        /* =========================================
           🔥 CRÉER LE COMPTE FIREBASE
        ========================================= */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        console.log(
            "👤 Utilisateur Firebase créé :",
            user.uid
        );


        /* =========================================
           📚 CRÉER LE PROFIL FIRESTORE
        ========================================= */

        await setDoc(

            doc(
                db,
                "users",
                user.uid
            ),

            {

                uid: user.uid,

                fullname: fullname,

                school: school,

                age: numericAge,

                email: user.email,

                country: country,

                dateInscription:
                    serverTimestamp()

            }

        );


        console.log(
            "✅ Profil Firestore créé"
        );


        console.log(
            "🌍 Pays enregistré :",
            country
        );


        /* =========================================
           🎉 SUCCÈS
        ========================================= */

        alert(
            "Compte créé avec succès ✨"
        );


        /* =========================================
           🏠 REDIRECTION
        ========================================= */

        window.location.href =
            "Accueil-hg.html";


    }


    catch (error) {


        console.error(
            "❌ Erreur inscription :",
            error
        );


        /* =========================================
           📧 EMAIL DÉJÀ UTILISÉ
        ========================================= */

        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            alert(
                "Cette adresse email possède déjà un compte ❌"
            );

        }


        /* =========================================
           📧 EMAIL INVALIDE
        ========================================= */

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            alert(
                "Cette adresse email n'est pas valide ❌"
            );

        }


        /* =========================================
           🔐 MOT DE PASSE FAIBLE
        ========================================= */

        else if (
            error.code ===
            "auth/weak-password"
        ) {

            alert(
                "Le mot de passe est trop faible ❌"
            );

        }


        /* =========================================
           🚫 INSCRIPTION NON AUTORISÉE
        ========================================= */

        else if (
            error.code ===
            "auth/operation-not-allowed"
        ) {

            alert(
                "L'inscription par email n'est pas activée dans Firebase ⚠️"
            );

        }


        /* =========================================
           🌐 RÉSEAU
        ========================================= */

        else if (
            error.code ===
            "auth/network-request-failed"
        ) {

            alert(
                "Problème de connexion Internet. Vérifie ta connexion puis réessaie 📶"
            );

        }


        /* =========================================
           ❌ AUTRE ERREUR
        ========================================= */

        else {

            alert(

                "Une erreur est survenue pendant l'inscription 😭\n\n" +
                error.message

            );

        }


        /* =========================================
           🔄 RÉACTIVER LE BOUTON
        ========================================= */

        signupButton.disabled = false;

        signupButton.textContent =
            "S'inscrire";

    }

};

</script>


</body>

</html>

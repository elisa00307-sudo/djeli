<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inscription</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
    rel="stylesheet"
>

<style>

body{
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;

    background: linear-gradient(135deg,#0b3d91,#4169e1);

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    opacity: 0;
    transform: translateY(20px);
    animation: fadePage 1s ease forwards;
}

@keyframes fadePage{

    to{
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   CARTE
========================= */

.student-card{

    background: white;

    width: 90%;
    max-width: 420px;

    padding: 40px 30px;

    border-radius: 30px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);

    text-align: center;

    animation: cardFloat 3s ease-in-out infinite;
}

@keyframes cardFloat{

    0%{
        transform: translateY(0px);
    }

    50%{
        transform: translateY(-5px);
    }

    100%{
        transform: translateY(0px);
    }

}

.student-card h2{

    color: #0b3d91;

    margin-bottom: 30px;

}


/* =========================
   INPUTS
========================= */

.student-card input{

    width: 90%;

    padding: 14px;

    margin-bottom: 18px;

    border-radius: 15px;

    border: 2px solid #ddd;

    font-size: 15px;

    font-family: 'Poppins', sans-serif;

    transition: 0.3s;

    outline: none;
}

.student-card input:focus{

    border-color: royalblue;

    box-shadow: 0 0 10px rgba(65,105,225,0.3);

}


/* =========================
   BOUTON
========================= */

.save-btn{

    background: gold;

    color: black;

    border: none;

    padding: 14px 35px;

    border-radius: 40px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: all 0.3s ease;

    font-family: 'Poppins', sans-serif;
}

.save-btn:hover{

    background: royalblue;

    color: white;

    transform: scale(1.05);

    box-shadow: 0 8px 20px rgba(65,105,225,0.4);

}


/* =========================
   TEXTE BAS
========================= */

.bottom-text{

    margin-top: 25px;

    font-size: 14px;
}

.bottom-text a{

    color: #0b3d91;

    text-decoration: none;

    font-weight: bold;
}

.bottom-text a:hover{

    color: royalblue;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

    .student-card{

        padding: 30px 20px;

    }

    .student-card h2{

        font-size: 24px;

    }

}

</style>

</head>


<body>


<div class="student-card">

    <h2>Créer un compte ✨</h2>


    <input
        type="text"
        id="fullname"
        placeholder="Nom et prénom"
    >


    <input
        type="text"
        id="school"
        placeholder="École"
    >


    <input
        type="number"
        id="age"
        placeholder="Âge"
    >


    <input
        type="email"
        id="email"
        placeholder="Email"
    >


    <input
        type="password"
        id="password"
        placeholder="Mot de passe"
    >


    <button
        class="save-btn"
        onclick="signup()"
        id="signupButton"
    >

        S'inscrire

    </button>


    <div class="bottom-text">

        Déjà un compte ?

        <a href="login.html">
            Connexion
        </a>

    </div>

</div>


<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   🌍 DÉTECTER AUTOMATIQUEMENT LE PAYS
========================================= */

async function detectCountry() {

    try {

        const response = await fetch(
            "https://ipapi.co/json/"
        );

        if (!response.ok) {

            throw new Error(
                "Impossible de récupérer la localisation."
            );

        }

        const location = await response.json();

        console.log(
            "🌍 Pays détecté :",
            location.country_name
        );

        return location.country_name || "Inconnu";

    }

    catch (error) {

        console.warn(
            "⚠️ Détection du pays impossible :",
            error
        );

        return "Inconnu";

    }

}


/* =========================================
   📝 INSCRIPTION
========================================= */

window.signup = async function () {


    const fullname =
        document.getElementById("fullname").value.trim();


    const school =
        document.getElementById("school").value.trim();


    const age =
        document.getElementById("age").value.trim();


    const email =
        document.getElementById("email").value.trim();


    const password =
        document.getElementById("password").value;


    const signupButton =
        document.getElementById("signupButton");


    /* =========================================
       🔎 VÉRIFICATION DES CHAMPS
    ========================================= */

    if (
        !fullname ||
        !school ||
        !age ||
        !email ||
        !password
    ) {

        alert(
            "Remplis tous les champs 😭"
        );

        return;

    }


    /* =========================================
       🎂 VÉRIFICATION DE L'ÂGE
    ========================================= */

    if (
        Number(age) < 10 ||
        Number(age) > 100
    ) {

        alert(
            "Entre un âge valide 📚"
        );

        return;

    }


    /* =========================================
       🔐 VÉRIFICATION DU MOT DE PASSE
    ========================================= */

    if (password.length < 6) {

        alert(
            "Ton mot de passe doit contenir au moins 6 caractères 🔐"
        );

        return;

    }


    try {


        /* =========================================
           ⏳ DÉSACTIVER LE BOUTON
        ========================================= */

        signupButton.disabled = true;

        signupButton.textContent =
            "Création du compte...";


        /* =========================================
           🌍 DÉTECTER LE PAYS
        ========================================= */

        const country =
            await detectCountry();


        console.log(
            "🌍 Pays enregistré :",
            country
        );


        /* =========================================
           🔥 CRÉER LE COMPTE FIREBASE
        ========================================= */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        console.log(
            "👤 Utilisateur Firebase créé :",
            user.uid
        );


        /* =========================================
           📚 CRÉER LE PROFIL FIRESTORE
        ========================================= */

        await setDoc(

            doc(
                db,
                "users",
                user.uid
            ),

            {

                uid: user.uid,

                fullname: fullname,

                school: school,

                age: Number(age),

                email: user.email,

                country: country,

                dateInscription:
                    serverTimestamp()

            }

        );


        console.log(
            "✅ Profil Firestore créé"
        );


        console.log(
            "🌍 Pays enregistré :",
            country
        );


        /* =========================================
           🎉 SUCCÈS
        ========================================= */

        alert(
            "Compte créé avec succès ✨"
        );


        /* =========================================
           🏠 REDIRECTION
        ========================================= */

        window.location.href =
            "Accueil-hg.html";


    }


    catch (error) {


        console.error(
            "❌ Erreur inscription :",
            error
        );


        /* =========================================
           📧 EMAIL DÉJÀ UTILISÉ
        ========================================= */

        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            alert(
                "Cette adresse email possède déjà un compte ❌"
            );

        }


        /* =========================================
           📧 EMAIL INVALIDE
        ========================================= */

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            alert(
                "Cette adresse email n'est pas valide ❌"
            );

        }


        /* =========================================
           🔐 MOT DE PASSE FAIBLE
        ========================================= */

        else if (
            error.code ===
            "auth/weak-password"
        ) {

            alert(
                "Le mot de passe est trop faible ❌"
            );

        }


        /* =========================================
           🚫 INSCRIPTION NON AUTORISÉE
        ========================================= */

        else if (
            error.code ===
            "auth/operation-not-allowed"
        ) {

            alert(
                "L'inscription par email n'est pas activée dans Firebase ⚠️"
            );

        }


        /* =========================================
           ❌ AUTRE ERREUR
        ========================================= */

        else {

            alert(

                "Une erreur est survenue pendant l'inscription 😭\n\n" +
                error.message

            );

        }


        /* =========================================
           🔄 RÉACTIVER LE BOUTON
        ========================================= */

        signupButton.disabled = false;

        signupButton.textContent =
            "S'inscrire";

    }

};

</script>


</body>

</html>
